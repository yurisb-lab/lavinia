<!doctype html>
<html lang="pt-BR" data-theme="rosa" data-theme-default="rosa" data-theme-key="lavinia-tema">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aplicativo da Lavínia</title>
  <meta name="description" content="Aplicativo da Lavínia: crie photo cards com fotos, textos, adesivos e molduras e imprima em folha A4 com marcas de corte.">
  <meta name="theme-color" content="#ffe3ef">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lavínia">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/themes.css">
  <script>try{var t=localStorage.getItem('lavinia-tema');if(/^(atelie|rosa|azul|lilas|menta|coral)$/.test(t||''))document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Aplicativo da Lavínia, ir para o início">
      <span class="brand__badge" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="44" height="44"><rect x="12" y="5" width="24" height="38" rx="5" fill="#fff" stroke="#c92f6c" style="stroke:var(--berry)" stroke-width="3"/><path d="M24 33s-7-4.3-7-9.2a3.9 3.9 0 0 1 7-2.4 3.9 3.9 0 0 1 7 2.4c0 4.9-7 9.2-7 9.2z" fill="#ff7aa8" style="fill:var(--pink)"/><path d="M33.5 7.5c.4 2.9 1.6 4.1 4.5 4.5-2.9.4-4.1 1.6-4.5 4.5-.4-2.9-1.6-4.1-4.5-4.5 2.9-.4 4.1-1.6 4.5-4.5z" fill="#ffc94d"/></svg>
      </span>
      <span class="brand__text">Aplicativo da <span class="brand__name">Lavínia</span></span>
    </a>
    <div class="topbar__actions">
      <a class="home-link" href="#/">
        <svg class="ic" aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v9.5h11V10"/><path d="M10 19.5v-5h4v5"/></svg>
        <span class="topbar-btn__label">Início</span>
      </a>
      <button class="topbar-btn" id="theme-btn" type="button" aria-expanded="false" aria-haspopup="dialog" aria-controls="theme-pop" aria-label="Cores do aplicativo">
        <svg class="ic" aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.4 0 2-1 1.6-2.1-.5-1.3.2-2.4 1.6-2.4H17a3.5 3.5 0 0 0 3.5-3.5c0-5-3.8-9-8.5-9z"/><circle cx="8" cy="10" r="1.1" fill="currentColor"/><circle cx="12" cy="7.5" r="1.1" fill="currentColor"/><circle cx="16" cy="10" r="1.1" fill="currentColor"/></svg>
        <span class="topbar-btn__label" aria-hidden="true">Cores</span>
      </button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <noscript><p class="noscript">Para usar o aplicativo, ative o JavaScript do navegador.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
